<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actualizar contraseña — Annly</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#FBF8FE;
  font-family:Inter,Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#242220;
}

.card{
  width:min(400px,calc(100% - 32px));
  background:#fff;
  border:1px solid #EAE5DB;
  border-radius:20px;
  padding:32px;
  box-shadow:0 20px 50px rgba(47,27,73,.12);
}

.logo{
  text-align:center;
  font-family:Georgia,serif;
  font-size:30px;
  font-weight:700;
  margin-bottom:8px;
}

.logo span{
  color:#EC4899;
}

h1{
  text-align:center;
  font-family:Georgia,serif;
  font-size:22px;
  margin:0 0 7px;
}

.sub{
  text-align:center;
  color:#8A8378;
  font-size:12px;
  line-height:1.5;
  margin-bottom:22px;
}

label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin:0 0 7px;
}

input{
  width:100%;
  padding:12px 13px;
  border:1px solid #EAE5DB;
  border-radius:11px;
  font-size:14px;
  outline:none;
  margin-bottom:14px;
}

input:focus{
  border-color:#BBA2E6;
}

button{
  width:100%;
  border:0;
  border-radius:999px;
  padding:13px;
  background:linear-gradient(100deg,#7C3AED,#EC4899);
  color:#fff;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:default;
}

#msg{
  text-align:center;
  min-height:18px;
  font-size:12px;
  margin-top:14px;
  color:#C2695A;
}

#formulario{
  display:none;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">
    Ann<span>ly</span>
  </div>

  <h1>Crear nueva contraseña</h1>

  <div class="sub" id="submensaje">
    Verificando el enlace de recuperación...
  </div>

  <div id="formulario">

    <label for="pass1">
      Nueva contraseña
    </label>

    <input
      id="pass1"
      type="password"
      autocomplete="new-password"
      placeholder="Mínimo 6 caracteres"
    >

    <label for="pass2">
      Confirmar contraseña
    </label>

    <input
      id="pass2"
      type="password"
      autocomplete="new-password"
      placeholder="Repite la contraseña"
    >

    <button
      id="btn"
      onclick="actualizarPassword()"
    >
      Guardar nueva contraseña
    </button>

  </div>

  <div id="msg"></div>

</div>


<script>

let recoveryReady = false;


/* =========================================================
   MOSTRAR MENSAJE
========================================================= */

function mostrarMensaje(texto, color = '#C2695A') {

  const msg = document.getElementById('msg');

  msg.style.color = color;
  msg.textContent = texto;

}


/* =========================================================
   MOSTRAR FORMULARIO
========================================================= */

function mostrarFormulario() {

  recoveryReady = true;

  document.getElementById('formulario').style.display = 'block';

  document.getElementById('submensaje').textContent =
    'Escribe tu nueva contraseña para continuar.';

  mostrarMensaje('');

}


/* =========================================================
   INICIALIZAR RECUPERACIÓN
========================================================= */

async function inicializarRecovery() {

  try {

    /*
     * -------------------------------------------------------
     * 1. DETECTAR CODE DE PKCE
     * -------------------------------------------------------
     */

    const url = new URL(window.location.href);

    const code = url.searchParams.get('code');

    if (code) {

      console.log('[Annly Password] Código PKCE detectado.');

      const {
        data,
        error
      } = await sbClient.auth.exchangeCodeForSession(code);

      if (error) {
        console.error(
          '[Annly Password] Error exchangeCodeForSession:',
          error
        );

        throw new Error(
          'El enlace de recuperación no es válido o ya expiró.'
        );
      }

      if (data?.session) {

        console.log(
          '[Annly Password] Sesión de recuperación creada.'
        );

        /*
         * Quitamos el code de la URL.
         */
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );

        mostrarFormulario();

        return;
      }
    }


    /*
     * -------------------------------------------------------
     * 2. ESPERAR PASSWORD_RECOVERY
     * -------------------------------------------------------
     */

    const {
      data: listener
    } = sbClient.auth.onAuthStateChange(
      async (event, session) => {

        console.log(
          '[Annly Password] Auth event:',
          event
        );

        if (
          event === 'PASSWORD_RECOVERY' &&
          session
        ) {

          console.log(
            '[Annly Password] Recovery autorizado.'
          );

          recoveryReady = true;

          mostrarFormulario();

        }

      }
    );


    /*
     * -------------------------------------------------------
     * 3. REVISAR SESIÓN EXISTENTE
     * -------------------------------------------------------
     */

    const {
      data: sessionData
    } = await sbClient.auth.getSession();


    if (
      sessionData?.session &&
      !recoveryReady
    ) {

      console.log(
        '[Annly Password] Sesión encontrada.'
      );

      mostrarFormulario();

      return;
    }


    /*
     * -------------------------------------------------------
     * 4. ESPERAR UN MOMENTO POR EL REDIRECT
     * -------------------------------------------------------
     */

    setTimeout(async () => {

      if (recoveryReady) {
        return;
      }

      const {
        data
      } = await sbClient.auth.getSession();

      if (data?.session) {

        mostrarFormulario();

      } else {

        mostrarMensaje(
          'El enlace de recuperación no es válido o ya expiró.'
        );

        document.getElementById(
          'submensaje'
        ).textContent =
          'Solicita un nuevo enlace para continuar.';

      }

    }, 1500);

  } catch (error) {

    console.error(
      '[Annly Password] Error inicializando:',
      error
    );

    mostrarMensaje(
      error.message ||
      'El enlace de recuperación no es válido o ya expiró.'
    );

    document.getElementById(
      'submensaje'
    ).textContent =
      'Solicita un nuevo enlace para continuar.';

  }

}


/* =========================================================
   ACTUALIZAR PASSWORD
========================================================= */

async function actualizarPassword() {

  const p1 =
    document.getElementById('pass1').value;

  const p2 =
    document.getElementById('pass2').value;

  const btn =
    document.getElementById('btn');


  mostrarMensaje('');


  if (!recoveryReady) {

    mostrarMensaje(
      'El enlace de recuperación no está listo.'
    );

    return;
  }


  if (!p1 || !p2) {

    mostrarMensaje(
      'Completa ambos campos.'
    );

    return;
  }


  if (p1.length < 6) {

    mostrarMensaje(
      'La contraseña debe tener al menos 6 caracteres.'
    );

    return;
  }


  if (p1 !== p2) {

    mostrarMensaje(
      'Las contraseñas no coinciden.'
    );

    return;
  }


  btn.disabled = true;

  btn.textContent = 'Guardando...';


  try {

    const {
      data: sessionData
    } = await sbClient.auth.getSession();


    if (!sessionData?.session) {

      throw new Error(
        'La sesión de recuperación expiró. Solicita un nuevo enlace.'
      );

    }


    const {
      error
    } = await sbClient.auth.updateUser({
      password: p1
    });


    if (error) {

      throw error;

    }


    mostrarMensaje(
      'Contraseña actualizada. Entrando al panel...',
      '#3a7a3a'
    );


    setTimeout(() => {

      window.location.href =
        window.location.origin + '/admin.html';

    }, 1000);


  } catch (error) {

    console.error(
      '[Annly Password]',
      error
    );

    mostrarMensaje(
      error.message ||
      'No se pudo actualizar la contraseña.'
    );

    btn.disabled = false;

    btn.textContent =
      'Guardar nueva contraseña';

  }

}


/* =========================================================
   ARRANCAR
========================================================= */

document.addEventListener(
  'DOMContentLoaded',
  inicializarRecovery
);

</script>

</body>
</html>
