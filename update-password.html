<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actualizar contraseña — Annly</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="sheets.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#FBF8FE;font-family:Inter,Arial,sans-serif;display:flex;align-items:center;justify-content:center;color:#242220}
.card{width:min(400px,calc(100% - 32px));background:#fff;border:1px solid #EAE5DB;border-radius:20px;padding:32px;box-shadow:0 20px 50px rgba(47,27,73,.12)}
.logo{text-align:center;font-family:Georgia,serif;font-size:30px;font-weight:700;margin-bottom:8px}
.logo span{color:#EC4899}
h1{text-align:center;font-family:Georgia,serif;font-size:22px;margin:0 0 7px}
.sub{text-align:center;color:#8A8378;font-size:12px;line-height:1.5;margin-bottom:22px}
label{display:block;font-size:12px;font-weight:700;margin:0 0 7px}
input{width:100%;padding:12px 13px;border:1px solid #EAE5DB;border-radius:11px;font-size:14px;outline:none;margin-bottom:14px}
input:focus{border-color:#BBA2E6}
button{width:100%;border:0;border-radius:999px;padding:13px;background:linear-gradient(100deg,#7C3AED,#EC4899);color:#fff;font-size:14px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#msg{text-align:center;min-height:18px;font-size:12px;margin-top:14px;color:#C2695A}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Ann<span>ly</span></div>
  <h1>Crear nueva contraseña</h1>
  <div class="sub">Escribe tu nueva contraseña para continuar.</div>

  <label for="pass1">Nueva contraseña</label>
  <input id="pass1" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres">

  <label for="pass2">Confirmar contraseña</label>
  <input id="pass2" type="password" autocomplete="new-password" placeholder="Repite la contraseña">

  <button id="btn" onclick="actualizarPassword()">Guardar nueva contraseña</button>
  <div id="msg"></div>
</div>

<script>
async function actualizarPassword(){
  const p1=document.getElementById('pass1').value;
  const p2=document.getElementById('pass2').value;
  const msg=document.getElementById('msg');
  const btn=document.getElementById('btn');

  msg.style.color='#C2695A';
  msg.textContent='';

  if(!p1 || !p2){ msg.textContent='Completa ambos campos.'; return; }
  if(p1.length < 6){ msg.textContent='La contraseña debe tener al menos 6 caracteres.'; return; }
  if(p1 !== p2){ msg.textContent='Las contraseñas no coinciden.'; return; }

  btn.disabled=true;
  btn.textContent='Guardando...';

  try{
    const { data: sessionData } = await sbClient.auth.getSession();
    if(!sessionData || !sessionData.session){
      throw new Error('El enlace de recuperación no es válido o ya expiró.');
    }

    const { error } = await sbClient.auth.updateUser({ password:p1 });
    if(error) throw error;

    msg.style.color='#3a7a3a';
    msg.textContent='Contraseña actualizada. Entrando al panel...';

    setTimeout(() => {
      window.location.href = window.location.origin + '/admin.html';
    }, 900);
  }catch(e){
    console.error('[Annly Password]',e);
    msg.textContent=e.message || 'No se pudo actualizar la contraseña.';
    btn.disabled=false;
    btn.textContent='Guardar nueva contraseña';
  }
}
</script>
</body>
</html>
