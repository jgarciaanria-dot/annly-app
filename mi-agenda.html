<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#7c3aed">
<title>Mi agenda · Annly</title>
<style>
:root{--bg:#faf7fc;--card:#fff;--ink:#2b1b3d;--soft:#77738a;--line:#e8def3;--purple:#7c3aed;--amber:#b45309;--amberbg:#fff4e0;--green:#15803d;--greenbg:#e7f8ee}
@media(prefers-color-scheme:dark){:root{--bg:#171022;--card:#221733;--ink:#f3ecfb;--soft:#a79bb8;--line:#3a2b52;--amberbg:#3a2a10;--amber:#f5c26b;--greenbg:#12301f;--green:#6fdc98}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
header{padding:calc(18px + env(safe-area-inset-top)) 0 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{font-size:22px;margin:0}
.neg{font-size:13px;color:var(--soft);margin-top:2px}
button.act{border:1px solid var(--line);background:var(--card);color:var(--purple);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;white-space:nowrap}
button.act:disabled{opacity:.6}
.barra{display:flex;align-items:center;gap:8px;margin:4px 0 6px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--soft);font-family:inherit;font-weight:700;font-size:14px;padding:7px 16px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--purple);color:#fff}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 4px}
.nav button{border:1px solid var(--line);background:var(--card);color:var(--purple);border-radius:50%;width:42px;height:42px;font-size:20px;line-height:1;cursor:pointer;font-family:inherit}
.nav button:disabled{opacity:.35}
.nav .ctr{flex:1;text-align:center;font-weight:800;font-size:17px}
.nav .ctr small{display:block;font-weight:500;font-size:12px;color:var(--soft)}
.hoy-btn{border:0;background:none;color:var(--purple);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;padding:0;margin-top:2px}
.dia.pasado{opacity:.6}
.libre{color:var(--soft);font-size:14px;padding:2px 2px 4px}
.dia{margin:20px 0 8px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
.dia b{color:var(--ink)}
.cita{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px}
.hora{min-width:64px;font-weight:800;font-size:17px;line-height:1.15}
.hora small{display:block;font-weight:500;font-size:12px;color:var(--soft)}
.info{flex:1;min-width:0}
.srv{font-weight:700}
.cli{color:var(--soft);font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.cli a{color:var(--purple);text-decoration:none;font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;margin-top:6px;margin-right:6px}
.tag.pc{background:var(--amberbg);color:var(--amber)}
.tag.ok{background:var(--greenbg);color:var(--green)}
.tag.sd{background:var(--bg);color:var(--soft);border:1px solid var(--line)}
.vacio,.error{text-align:center;color:var(--soft);padding:36px 12px}
.error h2{color:var(--ink);font-size:18px;margin:0 0 6px}
.mas{display:block;margin:14px auto 0}
.pie{text-align:center;font-size:12px;color:var(--soft);margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 id="titulo">Mi agenda</h1><div class="neg" id="neg"></div></div>
    <button class="act" id="refrescar" type="button" hidden>Actualizar</button>
  </header>
  <div class="barra"><div class="seg" role="tablist"><button type="button" id="vDia" class="on">Día</button><button type="button" id="vSem">Semana</button></div></div>
  <div id="nav"></div>
  <main id="lista"><div class="vacio">Cargando tu agenda…</div></main>
  <div class="pie" id="pie" hidden></div>
</div>
<script>
(function () {
  var URL_FN = 'https://hokrimtsyseuqfjjvmxu.supabase.co/functions/v1/agenda-profesional';
  var lista = document.getElementById('lista'), btn = document.getElementById('refrescar'), pie = document.getElementById('pie');
  var token = (new URLSearchParams(location.search).get('t') || '').trim();
  var DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'], MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  var datos = null;

  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function parteFecha(iso) { var p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function suma(iso, n) { var d = parteFecha(iso); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function etiquetaDia(iso, hoy) {
    var d = parteFecha(iso), f = DIAS[d.getDay()] + ' ' + d.getDate() + ' ' + MESES[d.getMonth()];
    if (iso === hoy) return ['Hoy', f];
    if (iso === suma(hoy, 1)) return ['Mañana', f];
    return [f.charAt(0).toUpperCase() + f.slice(1), ''];
  }
  function hora12(h) { var p = String(h || '').split(':'), n = parseInt(p[0], 10); if (isNaN(n)) return ''; return ((n % 12) || 12) + ':' + (p[1] || '00') + ' ' + (n >= 12 ? 'p. m.' : 'a. m.'); }
  function horaFin(h, min) {
    if (!min) return ''; var p = String(h).split(':'), t = parseInt(p[0], 10) * 60 + parseInt(p[1] || '0', 10) + Number(min), n = Math.floor(t / 60) % 24;
    return hora12(String(n).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'));
  }
  function solo(tel) { return String(tel || '').replace(/\D/g, ''); }

  function error(t, d) { lista.textContent = ''; document.getElementById('nav').textContent = ''; document.querySelector('.barra').hidden = true; var b = el('div', 'error'); b.appendChild(el('h2', null, t)); b.appendChild(el('div', null, d)); lista.appendChild(b); btn.hidden = true; }

  var modo = 'dia', ref = null, MIN = null, MAX = null;
  try { if (localStorage.getItem('annlyAgendaModo') === 'semana') modo = 'semana'; } catch (e) {}
  var NOM3 = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
  function lunesDe(iso) { var d = parteFecha(iso), k = (d.getDay() + 6) % 7; return suma(iso, -k); }
  function tarjeta(c) {
    var card = el('div', 'cita'), hr = el('div', 'hora', hora12(c.hora)), fin = horaFin(c.hora, c.duracion);
    if (fin) hr.appendChild(el('small', null, 'hasta ' + fin));
    var inf = el('div', 'info'); inf.appendChild(el('div', 'srv', c.servicio || 'Cita'));
    var cl = el('div', 'cli', c.cliente || 'Cliente'), t = solo(c.telefono);
    if (t) { cl.appendChild(document.createTextNode(' · ')); var a = el('a', null, c.telefono); a.href = 'tel:' + t; cl.appendChild(a); var w = el('a', null, ' WhatsApp'); w.href = 'https://wa.me/' + (t.length === 8 ? '507' + t : t); w.target = '_blank'; w.rel = 'noopener'; cl.appendChild(document.createTextNode(' · ')); cl.appendChild(w); }
    inf.appendChild(cl);
    if (c.estado === 'por_confirmar' || c.estado === 'pendiente') inf.appendChild(el('span', 'tag pc', 'Por confirmar'));
    else inf.appendChild(el('span', 'tag ok', 'Confirmada'));
    if (c.sede) inf.appendChild(el('span', 'tag sd', c.sede));
    card.appendChild(hr); card.appendChild(inf); return card;
  }
  function titDia(f, n, hoy) {
    var et = etiquetaDia(f, hoy), h = el('div', 'dia' + (f < hoy ? ' pasado' : '')), b = el('b', null, et[0]);
    h.appendChild(b); if (et[1]) h.appendChild(document.createTextNode(' · ' + et[1]));
    h.appendChild(document.createTextNode(' · ' + (n ? n + (n === 1 ? ' cita' : ' citas') : 'sin citas')));
    return h;
  }
  function boton(txt, fn, dis, aria) { var b = el('button', null, txt); b.type = 'button'; b.disabled = !!dis; if (aria) b.setAttribute('aria-label', aria); b.addEventListener('click', fn); return b; }

  function pintar() {
    var d = datos, nav = document.getElementById('nav'); lista.textContent = ''; nav.textContent = '';
    document.getElementById('titulo').textContent = 'Agenda de ' + d.profesional;
    document.getElementById('neg').textContent = d.negocio;
    document.title = 'Agenda de ' + d.profesional + ' · Annly';
    document.getElementById('vDia').className = modo === 'dia' ? 'on' : '';
    document.getElementById('vSem').className = modo === 'semana' ? 'on' : '';
    MIN = suma(d.hoy, -7); MAX = suma(d.hoy, 60);
    if (!ref) ref = d.hoy;
    var por = {}; d.citas.forEach(function (c) { (por[c.fecha] = por[c.fecha] || []).push(c); });
    var n = el('div', 'nav'), ctr = el('div', 'ctr'), irHoy = null;
    if (modo === 'dia') {
      var et = etiquetaDia(ref, d.hoy), cant = (por[ref] || []).length;
      ctr.appendChild(document.createTextNode(et[0] === 'Hoy' || et[0] === 'Mañana' ? et[0] : et[0]));
      ctr.appendChild(el('small', null, (et[1] || '') + (et[1] ? ' · ' : '') + (cant ? cant + (cant === 1 ? ' cita' : ' citas') : 'sin citas')));
      n.appendChild(boton('‹', function () { ref = suma(ref, -1); pintar(); }, ref <= MIN, 'Día anterior')); n.appendChild(ctr);
      n.appendChild(boton('›', function () { ref = suma(ref, 1); pintar(); }, ref >= MAX, 'Día siguiente'));
      if (ref !== d.hoy) irHoy = true;
      nav.appendChild(n);
      if (irHoy) { var hb = el('div'); hb.style.textAlign = 'center'; var hbtn = el('button', 'hoy-btn', 'Ir a hoy'); hbtn.type = 'button'; hbtn.addEventListener('click', function () { ref = d.hoy; pintar(); }); hb.appendChild(hbtn); nav.appendChild(hb); }
      if (!cant) lista.appendChild(el('div', 'vacio', ref < d.hoy ? 'No hubo citas este día.' : 'No tienes citas este día.'));
      (por[ref] || []).forEach(function (c) { lista.appendChild(tarjeta(c)); });
    } else {
      var lun = lunesDe(ref), dom = suma(lun, 6), total = 0, i;
      for (i = 0; i < 7; i++) total += (por[suma(lun, i)] || []).length;
      var a = parteFecha(lun), b2 = parteFecha(dom);
      ctr.appendChild(document.createTextNode(a.getDate() + ' ' + MESES[a.getMonth()] + ' – ' + b2.getDate() + ' ' + MESES[b2.getMonth()]));
      ctr.appendChild(el('small', null, (lun <= d.hoy && d.hoy <= dom ? 'Esta semana · ' : '') + (total ? total + (total === 1 ? ' cita' : ' citas') : 'sin citas')));
      n.appendChild(boton('‹', function () { ref = suma(lun, -7); pintar(); }, suma(lun, -1) < MIN, 'Semana anterior')); n.appendChild(ctr);
      n.appendChild(boton('›', function () { ref = suma(lun, 7); pintar(); }, suma(lun, 7) > MAX, 'Semana siguiente'));
      nav.appendChild(n);
      if (!(lun <= d.hoy && d.hoy <= dom)) { var hb2 = el('div'); hb2.style.textAlign = 'center'; var hbtn2 = el('button', 'hoy-btn', 'Ir a esta semana'); hbtn2.type = 'button'; hbtn2.addEventListener('click', function () { ref = d.hoy; pintar(); }); hb2.appendChild(hbtn2); nav.appendChild(hb2); }
      for (i = 0; i < 7; i++) {
        var f = suma(lun, i), lst = por[f] || [];
        lista.appendChild(titDia(f, lst.length, d.hoy));
        if (!lst.length) lista.appendChild(el('div', 'libre', f < MIN ? '—' : 'Libre'));
        lst.forEach(function (c) { lista.appendChild(tarjeta(c)); });
      }
    }
  }
  function cambiar(m) { modo = m; try { localStorage.setItem('annlyAgendaModo', m); } catch (e) {} if (datos) pintar(); }
  document.getElementById('vDia').addEventListener('click', function () { cambiar('dia'); });
  document.getElementById('vSem').addEventListener('click', function () { cambiar('semana'); });

  function cargar() {
    if (!/^[a-f0-9]{48}$/i.test(token)) { error('Enlace no válido', 'Pídele a quien administra el negocio que te envíe de nuevo tu enlace.'); return Promise.resolve(); }
    btn.disabled = true;
    return fetch(URL_FN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: token }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { s: r.status, j: j }; }); })
      .then(function (x) {
        if (x.j && x.j.ok) { datos = x.j; btn.hidden = false; pintar(); pie.hidden = false; pie.textContent = 'Actualizado a las ' + new Date().toLocaleTimeString('es-PA', { hour: 'numeric', minute: '2-digit' }) + ' · Solo lectura'; }
        else if (x.s === 404) error('Enlace no disponible', 'Este enlace ya no funciona. Pídele a quien administra el negocio uno nuevo.');
        else if (!datos) error('No pude cargar tu agenda', 'Revisa tu conexión y toca Actualizar.');
      })
      .catch(function () { if (!datos) { error('Sin conexión', 'No pude cargar tu agenda. Inténtalo de nuevo en un momento.'); btn.hidden = false; } })
      .then(function () { btn.disabled = false; });
  }
  btn.addEventListener('click', cargar);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && datos) cargar(); });
  setInterval(function () { if (!document.hidden && datos) cargar(); }, 120000);
  cargar();
})();
</script>
</body>
</html>
